name: DevOps ML Monitor CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-compose:
    name: Test, build and Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: app
        run: python -m unittest -v test_modeling.py

      - name: Build container image
        run: docker build -t devops-ml-monitor:${{ github.sha }} .

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start stack with Docker Compose
        run: docker compose up --build -d

      - name: Wait for API and smoke test
        shell: bash
        run: |
          set -e
          for attempt in {1..36}; do
            if curl --fail --silent http://localhost:5000/health; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 10
          done
          curl --fail http://localhost:5000/
          curl --fail http://localhost:5000/metrics
          curl --fail -X POST http://localhost:5000/predict \
            -H 'Content-Type: application/json' \
            -d '{"features":[5.1,3.5,1.4,0.2]}'

      - name: Show Compose service status
        if: always()
        run: docker compose ps

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
